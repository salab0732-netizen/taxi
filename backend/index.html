// ==================== OCR ====================
// ملاحظة: الاستخراج يمر عبر السيرفر الخلفي (/api/ocr) الذي يحمّل مفتاح
// Gemini من backend/gemini_key.txt على الخادم فقط — لا يوجد أي مفتاح
// مكشوف هنا في كود الواجهة الأمامية.
async function extractCarteGriseData(base64Image, mimeType) {
  const res = await fetch(`${API_BASE}/ocr-carte-grise`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image_base64: base64Image, mime_type: mimeType })
  });
  const d = await res.json();
  if (!d.success) { console.error("OCR carte grise error:", d.error); return null; }
  return d.data;
}

async function extractLicenseData(base64Image, mimeType) {
  const res = await fetch(`${API_BASE}/ocr`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image_base64: base64Image, mime_type: mimeType })
  });
  const d = await res.json();
  if (!d.success) {
    console.error("OCR error:", d.error);
    return null;
  }
  return d.data;
}

// ==================== UPLOAD DOCUMENTS (رخصة + بطاقة رمادية) ====================
function UploadDocuments({ onDone }) {
  const [permisImg,   setPermisImg]   = useState(null); // base64 preview
  const [permisB64,   setPermisB64]   = useState("");
  const [permisData,  setPermisData]  = useState(null);
  const [permisLoad,  setPermisLoad]  = useState(false);
  const [permisErr,   setPermisErr]   = useState("");

  const [griseImg,    setGriseImg]    = useState(null);
  const [griseB64,    setGriseB64]    = useState("");
  const [griseData,   setGriseData]   = useState(null);
  const [griseLoad,   setGriseLoad]   = useState(false);
  const [griseErr,    setGriseErr]    = useState("");

  const permisRef = useRef();
  const griseRef  = useRef();

  async function handlePermis(file) {
    if (!file) return;
    setPermisErr(""); setPermisLoad(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      const b64  = e.target.result.split(",")[1];
      const mime = file.type || "image/jpeg";
      setPermisImg(e.target.result);
      setPermisB64(b64);
      try {
        const res = await fetch(`${API_BASE}/ocr`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({image_base64: b64, mime_type: mime})
        });
        const d = await res.json();
        if (d.success) setPermisData(d.data);
        else setPermisErr(d.error || "فشل استخراج بيانات الرخصة");
      } catch(e) { setPermisErr("خطأ في الاتصال"); }
      setPermisLoad(false);
    };
    reader.readAsDataURL(file);
  }

  async function handleGrise(file) {
    if (!file) return;
    setGriseErr(""); setGriseLoad(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      const b64  = e.target.result.split(",")[1];
      const mime = file.type || "image/jpeg";
      setGriseImg(e.target.result);
      setGriseB64(b64);
      try {
        const res = await fetch(`${API_BASE}/ocr-carte-grise`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({image_base64: b64, mime_type: mime})
        });
        const d = await res.json();
        if (d.success) setGriseData(d.data);
        else setGriseErr(d.error || "فشل استخراج بيانات البطاقة الرمادية");
      } catch(e) { setGriseErr("خطأ في الاتصال"); }
      setGriseLoad(false);
    };
    reader.readAsDataURL(file);
  }

  function handleContinue() {
    onDone(permisData, griseData, permisImg);
  }

  const cardStyle = {
    border:"2px dashed #d1d5db", borderRadius:14, padding:"16px 12px",
    textAlign:"center", cursor:"pointer", background:"#f9fafb",
    marginBottom:12, transition:"border-color .2s"
  };
  const cardActiveStyle = {...cardStyle, borderColor:"#1a6b3c", background:"#f0fdf4"};

  function ResultBadge({ data, label }) {
    if (!data) return null;
    const fields = Object.entries(data).filter(([,v])=>v&&v!==""&&!(Array.isArray(v)&&v.length===0));
    return (
      <div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,
        padding:"8px 12px",marginTop:8,textAlign:"right"}}>
        <div style={{color:"#15803d",fontWeight:700,fontSize:12,marginBottom:4}}>
          ✅ تم استخراج {fields.length} حقل
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
          {fields.slice(0,6).map(([k,v])=>(
            <span key={k} style={{background:"#dcfce7",color:"#166534",
              padding:"2px 6px",borderRadius:4,fontSize:11}}>
              {Array.isArray(v)?v.join(","): String(v).slice(0,15)}
            </span>
          ))}
          {fields.length>6&&<span style={{color:"#6b7280",fontSize:11}}>+{fields.length-6} أخرى</span>}
        </div>
      </div>
    );
  }

  return (
    <div>
      <h3 style={{color:"#1a6b3c",fontWeight:800,fontSize:17,marginBottom:20,textAlign:"center"}}>
        📄 رفع وثائق السائق
      </h3>

      {/* رخصة السياقة */}
      <div style={{marginBottom:20}}>
        <div style={{fontWeight:700,fontSize:14,color:"#374151",marginBottom:8}}>
          🪪 رخصة السياقة
        </div>
        <div onClick={()=>!permisLoad&&permisRef.current.click()}
          style={permisImg ? cardActiveStyle : cardStyle}>
          {permisLoad ? (
            <div style={{color:"#1a6b3c",fontSize:13}}>
              <div style={{width:28,height:28,border:"3px solid #1a6b3c",
                borderTopColor:"transparent",borderRadius:"50%",
                animation:"spin 1s linear infinite",margin:"0 auto 8px"}}/>
              جاري قراءة الرخصة...
            </div>
          ) : permisImg ? (
            <img src={permisImg} style={{maxHeight:120,maxWidth:"100%",borderRadius:6}} alt="رخصة"/>
          ) : (
            <div style={{color:"#9ca3af",fontSize:13}}>
              <div style={{fontSize:32,marginBottom:6}}>🪪</div>
              اضغط لرفع صورة رخصة السياقة
            </div>
          )}
        </div>
        <input ref={permisRef} type="file" accept="image/*" style={{display:"none"}}
          onChange={e=>handlePermis(e.target.files[0])}/>
        {permisErr && <div style={{color:"#dc2626",fontSize:12,marginTop:4}}>⚠️ {permisErr}</div>}
        <ResultBadge data={permisData} label="رخصة"/>
      </div>

      {/* البطاقة الرمادية */}
      <div style={{marginBottom:20}}>
        <div style={{fontWeight:700,fontSize:14,color:"#374151",marginBottom:8}}>
          🚗 البطاقة الرمادية
        </div>
        <div onClick={()=>!griseLoad&&griseRef.current.click()}
          style={griseImg ? {...cardStyle,borderColor:"#2563eb",background:"#eff6ff"} : cardStyle}>
          {griseLoad ? (
            <div style={{color:"#2563eb",fontSize:13}}>
              <div style={{width:28,height:28,border:"3px solid #2563eb",
                borderTopColor:"transparent",borderRadius:"50%",
                animation:"spin 1s linear infinite",margin:"0 auto 8px"}}/>
              جاري قراءة البطاقة الرمادية...
            </div>
          ) : griseImg ? (
            <img src={griseImg} style={{maxHeight:120,maxWidth:"100%",borderRadius:6}} alt="بطاقة رمادية"/>
          ) : (
            <div style={{color:"#9ca3af",fontSize:13}}>
              <div style={{fontSize:32,marginBottom:6}}>🚗</div>
              اضغط لرفع صورة البطاقة الرمادية
            </div>
          )}
        </div>
        <input ref={griseRef} type="file" accept="image/*" style={{display:"none"}}
          onChange={e=>handleGrise(e.target.files[0])}/>
        {griseErr && <div style={{color:"#dc2626",fontSize:12,marginTop:4}}>⚠️ {griseErr}</div>}
        <ResultBadge data={griseData} label="بطاقة رمادية"/>
      </div>

      <button onClick={handleContinue}
        style={{width:"100%",padding:13,borderRadius:10,border:"none",
          background:"#1a6b3c",color:"#fff",cursor:"pointer",fontWeight:700,fontSize:15}}>
        متابعة لمراجعة البيانات ←
      </button>
      <p style={{textAlign:"center",color:"#9ca3af",fontSize:12,marginTop:8}}>
        يمكنك المتابعة حتى بدون رفع الوثائق — ستُدخل البيانات يدوياً
      </p>
    </div>
  );
}

// ==================== CARTE GRISE UPLOAD (مستقل) ====================
function UploadCarteGrise({ onDone, color="#1a6b3c" }) {
  const [loading, setLoading] = useState(false);
  const [preview, setPreview] = useState(null);
  const [error, setError]     = useState("");
  const fileRef = useRef();

  async function handleFile(file) {
    if (!file) return;
    setError(""); setLoading(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      const b64 = e.target.result.split(",")[1];
      const mime = file.type || "image/jpeg";
      setPreview(e.target.result);
      try {
        const res = await fetch(`${API_BASE}/ocr-carte-grise`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({image_base64: b64, mime_type: mime})
        });
        const d = await res.json();
        if (d.success) onDone(d.data, e.target.result);
        else setError(d.error || "تعذّر استخراج البيانات — راجعها يدوياً");
      } catch(err) {
        setError("خطأ في الاتصال بالخادم");
      }
      setLoading(false);
    };
    reader.readAsDataURL(file);
  }

  return (
    <div>
      <div
        onClick={()=>!loading&&fileRef.current.click()}
        onDragOver={e=>e.preventDefault()}
        onDrop={e=>{e.preventDefault();handleFile(e.dataTransfer.files[0]);}}
        style={{border:`2px dashed ${color}`,borderRadius:14,padding:"20px 16px",
          textAlign:"center",cursor:loading?"default":"pointer",background:"#f8fffe",
          marginBottom:8,transition:"all .2s"}}
      >
        {loading ? (
          <div style={{color,fontSize:13}}>
            <div style={{width:28,height:28,border:`3px solid ${color}`,borderTopColor:"transparent",
              borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 8px"}}/>
            جاري استخراج بيانات المركبة...
          </div>
        ) : preview ? (
          <img src={preview} style={{maxHeight:140,maxWidth:"100%",borderRadius:8}} alt="carte grise"/>
        ) : (
          <div style={{color:"#9ca3af",fontSize:13}}>
            <div style={{fontSize:32,marginBottom:8}}>🚗</div>
            اضغط أو اسحب صورة البطاقة الرمادية هنا
          </div>
        )}
      </div>
      <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}}
        onChange={e=>handleFile(e.target.files[0])}/>
      {error&&<div style={{color:"#dc2626",fontSize:12,marginBottom:8}}>⚠️ {error}</div>}
      {preview&&!loading&&(
        <button onClick={()=>fileRef.current.click()}
          style={{width:"100%",padding:"8px",borderRadius:8,border:`1.5px solid ${color}`,
            background:"#fff",color,cursor:"pointer",fontWeight:600,fontSize:12}}>
          🔄 تغيير الصورة
        </button>
      )}
    </div>
  );
}

// ---- Step 1 ----
function UploadStep({ onDone }) {
  const [drag,setDrag]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [preview,setPreview]=useState(null);
  const ref=useRef();

  const process=useCallback(async(file)=>{
    if(!file?.type.startsWith("image/")){setError("يرجى رفع صورة صالحة (JPG، PNG)");return;}
    setError("");setLoading(true);
    const reader=new FileReader();
    reader.onload=async(e)=>{
      const dataUrl=e.target.result;
      setPreview(dataUrl);
      const b64=dataUrl.split(",")[1];
      try{
        const extracted=await extractLicenseData(b64,file.type);
        onDone(extracted||{},b64,dataUrl);
      }catch{
        setError("تعذّر استخراج البيانات — يمكنك إدخالها يدوياً.");
        onDone({},b64,dataUrl);
      }
      setLoading(false);
    };
    reader.readAsDataURL(file);
  },[onDone]);

  return (
    <div>
      <div
        onClick={()=>!loading&&ref.current?.click()}
        onDragOver={e=>{e.preventDefault();setDrag(true);}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);process(e.dataTransfer.files[0]);}}
        style={{
          border:`2px dashed ${drag?"#2d9e5f":"#d1d5db"}`,borderRadius:16,
          padding:"40px 20px",textAlign:"center",cursor:loading?"default":"pointer",
          background:drag?"#f0fdf4":"#fafafa",transition:"all .2s"
        }}>
        {preview
          ? <img src={preview} alt="" style={{maxHeight:200,maxWidth:"100%",borderRadius:8,objectFit:"contain"}}/>
          : <>
              <div style={{fontSize:52,marginBottom:10}}>🪪</div>
              <p style={{color:"#374151",fontWeight:600,fontSize:15,margin:"0 0 6px"}}>ارفع صورة رخصة السياقة</p>
              <p style={{color:"#9ca3af",fontSize:13,margin:0}}>الرخصة الورقية أو البطاقة البيومترية — JPG، PNG</p>
            </>
        }
        <input ref={ref} type="file" accept="image/*" style={{display:"none"}}
          onChange={e=>process(e.target.files[0])}/>
      </div>

      {loading&&(
        <div style={{textAlign:"center",marginTop:24}}>
          <div style={{display:"inline-block",width:40,height:40,border:"3px solid #e5e7eb",borderTopColor:"#2d9e5f",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
          <p style={{color:"#2d9e5f",marginTop:10,fontWeight:600}}>جارٍ استخراج البيانات...</p>
        </div>
      )}
      {error&&<div style={{marginTop:14,padding:"10px 14px",background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,color:"#dc2626",fontSize:13}}>{error}</div>}
      <div style={{marginTop:18,padding:"12px 14px",background:"#eff6ff",borderRadius:10,fontSize:13,color:"#1d4ed8"}}>
        💡 تأكد من وضوح الصورة وإضاءة جيدة — يمكنك تصحيح أي بيانات في الخطوة التالية.
      </div>
    </div>
  );
}

  const toggleCat=cat=>{

  function DetailModal() {
    if (!selected) return null;
    const isDriver   = selected._type === "driver";
    const isCompany  = selected._type === "company";
    const isBooklet  = selected._type === "booklet";
    const isHeritage = selected._type === "heritage";
    const color = isDriver?"#1a6b3c":isCompany?"#2563eb":isHeritage?"#7c3aed":"#b45309";
    const title = isDriver   ? `${selected.nom_ar||""} ${selected.prenom_ar||""}` :
                  isCompany  ? selected.nom_societe :
                  isHeritage ? `${selected.nom_ar||""} ${selected.prenom_ar||""} — ق.${selected.num_decision||""}` :
                  `${selected.nom_ar||""} ${selected.prenom_ar||""} — ${selected.registration_number||""}`;

    const fields = isDriver ? [
      ["اللقب (عربي)",selected.nom_ar],["الاسم (عربي)",selected.prenom_ar],
      ["Nom",selected.nom_fr],["Prénom",selected.prenom_fr],
      ["تاريخ الميلاد",selected.date_naissance],["مكان الميلاد",selected.lieu_naissance],
      ["الولاية",selected.wilaya_naissance],["NIN",selected.nin],

// ==================== نموذج التصريح (سائق + مركبة) ====================
function DeclarationForm({ onAdd, onCancel, BLUE }) {
  const [declStep, setDeclStep] = useState(0);
  const [form, setForm]         = useState(INITIAL_DECLARATION_FORM);
  const [licensePreview, setLicensePreview]     = useState(null);
  const [carteGrisePreview, setCarteGrisePreview] = useState(null);
  const [loading, setLoading]   = useState(false);

  const inp2 = {width:"100%",padding:"9px 11px",border:"1.5px solid #d1d5db",
    borderRadius:8,fontSize:13,outline:"none",boxSizing:"border-box",fontFamily:"inherit",background:"#fff"};

  const toggleCat = cat => {
    const cats = form.categories.includes(cat)
      ? form.categories.filter(c=>c!==cat)
      : [...form.categories, cat];
    setForm(f=>({...f, categories:cats}));
  };

  // خطوة 0: رفع رخصة السياقة
  async function handleLicenseFile(file) {
    if (!file) return;
    setLoading(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      const dataUrl = e.target.result;
      const b64 = dataUrl.split(",")[1];
      setLicensePreview(dataUrl);
      try {
        const data = await extractLicenseData(b64, file.type);
        if (data) setForm(f=>({...f, ...Object.fromEntries(Object.entries(data).filter(([,v])=>v!=="")), licenseImageB64: b64}));
        else setForm(f=>({...f, licenseImageB64: b64}));
      } catch {}
      setLoading(false);
      setDeclStep(1);
    };
    reader.readAsDataURL(file);
  }

  // خطوة 1: رفع البطاقة الرمادية
  async function handleCarteGriseFile(file) {
    if (!file) return;
    setLoading(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      const dataUrl = e.target.result;
      const b64 = dataUrl.split(",")[1];
      setCarteGrisePreview(dataUrl);
      try {
        const data = await extractCarteGriseData(b64, file.type);
        if (data) setForm(f=>({...f, ...Object.fromEntries(Object.entries(data).filter(([,v])=>v!=="")), carteGriseImageB64: b64}));
        else setForm(f=>({...f, carteGriseImageB64: b64}));
      } catch {}
      setLoading(false);
      setDeclStep(2);
    };
    reader.readAsDataURL(file);
  }

  const licenseRef    = React.useRef();
  const carteGriseRef = React.useRef();

  // ---- مؤشر الخطوات ----
  const steps = ["🪪 رخصة السياقة", "🚗 البطاقة الرمادية", "✏️ المراجعة"];

  return (
    <div style={{marginTop:16,background:"#fff",borderRadius:14,padding:18,border:`2px solid ${BLUE}44`,boxShadow:"0 2px 12px rgba(0,0,0,.06)"}}>

      {/* رأس النموذج */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <h5 style={{margin:0,color:BLUE,fontWeight:700,fontSize:15}}>📋 تصريح جديد — سائق ومركبة</h5>
        <button onClick={onCancel}
          style={{padding:"3px 10px",borderRadius:6,border:"1px solid #d1d5db",background:"#fff",cursor:"pointer",fontSize:13,color:"#6b7280"}}>
          ✕
        </button>
      </div>

      {/* شريط الخطوات */}
      <div style={{display:"flex",alignItems:"center",marginBottom:20,gap:0}}>
        {steps.map((s,i)=>(
          <React.Fragment key={i}>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4,flex:1}}>
              <div style={{
                width:30,height:30,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",
                fontWeight:700,fontSize:13,
                background: i < declStep ? BLUE : i === declStep ? BLUE+"cc" : "#e5e7eb",
                color: i <= declStep ? "#fff" : "#9ca3af",
                transition:"all .3s"
              }}>{i < declStep ? "✓" : i+1}</div>
              <span style={{fontSize:10,color:i===declStep?BLUE:"#9ca3af",fontWeight:i===declStep?700:400,textAlign:"center",whiteSpace:"nowrap"}}>{s}</span>
            </div>
            {i<2&&<div style={{height:2,flex:1,background:i<declStep?BLUE:"#e5e7eb",marginBottom:16,transition:"all .3s"}}/>}
          </React.Fragment>
        ))}
      </div>

      {/* ===== خطوة 0: رفع رخصة السياقة ===== */}
      {declStep === 0 && (
        <div>
          <div
            onClick={()=>!loading&&licenseRef.current.click()}
            onDragOver={e=>e.preventDefault()}
            onDrop={e=>{e.preventDefault();handleLicenseFile(e.dataTransfer.files[0]);}}
            style={{border:`2px dashed ${BLUE}`,borderRadius:12,padding:"32px 16px",textAlign:"center",
              cursor:loading?"default":"pointer",background:"#f8faff",marginBottom:12}}>
            {loading ? (
              <div style={{color:BLUE,fontSize:13}}>
                <div style={{width:30,height:30,border:`3px solid ${BLUE}`,borderTopColor:"transparent",
                  borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 10px"}}/>
                جارٍ استخراج بيانات الرخصة...
              </div>
            ) : licensePreview ? (
              <img src={licensePreview} style={{maxHeight:140,maxWidth:"100%",borderRadius:8}} alt="license"/>
            ) : (
              <>
                <div style={{fontSize:44,marginBottom:8}}>🪪</div>
                <p style={{color:"#374151",fontWeight:600,fontSize:14,margin:"0 0 4px"}}>ارفع صورة رخصة السياقة</p>
                <p style={{color:"#9ca3af",fontSize:12,margin:0}}>JPG، PNG — الرخصة الورقية أو البيومترية</p>
              </>
            )}
          </div>
          <input ref={licenseRef} type="file" accept="image/*" style={{display:"none"}}
            onChange={e=>handleLicenseFile(e.target.files[0])}/>
          <button onClick={()=>setDeclStep(1)}
            style={{width:"100%",padding:9,borderRadius:8,border:"1.5px solid #d1d5db",background:"#fff",
              cursor:"pointer",color:"#6b7280",fontSize:12,marginTop:4}}>
            تخطي — إدخال يدوي ←
          </button>
        </div>
      )}

      {/* ===== خطوة 1: رفع البطاقة الرمادية ===== */}
      {declStep === 1 && (
        <div>
          <div
            onClick={()=>!loading&&carteGriseRef.current.click()}
            onDragOver={e=>e.preventDefault()}
            onDrop={e=>{e.preventDefault();handleCarteGriseFile(e.dataTransfer.files[0]);}}
            style={{border:`2px dashed ${BLUE}`,borderRadius:12,padding:"32px 16px",textAlign:"center",
              cursor:loading?"default":"pointer",background:"#f8faff",marginBottom:12}}>
            {loading ? (
              <div style={{color:BLUE,fontSize:13}}>
                <div style={{width:30,height:30,border:`3px solid ${BLUE}`,borderTopColor:"transparent",
                  borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 10px"}}/>
                جارٍ استخراج بيانات المركبة...
              </div>
            ) : carteGrisePreview ? (
              <img src={carteGrisePreview} style={{maxHeight:140,maxWidth:"100%",borderRadius:8}} alt="carte grise"/>
            ) : (
              <>
                <div style={{fontSize:44,marginBottom:8}}>🚗</div>
                <p style={{color:"#374151",fontWeight:600,fontSize:14,margin:"0 0 4px"}}>ارفع صورة البطاقة الرمادية</p>
                <p style={{color:"#9ca3af",fontSize:12,margin:0}}>وثيقة تسجيل المركبة</p>
              </>
            )}
          </div>
          <input ref={carteGriseRef} type="file" accept="image/*" style={{display:"none"}}
            onChange={e=>handleCarteGriseFile(e.target.files[0])}/>
          <div style={{display:"flex",gap:8,marginTop:4}}>
            <button onClick={()=>setDeclStep(0)}
              style={{flex:1,padding:9,borderRadius:8,border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",color:"#6b7280",fontSize:12}}>
              ← رجوع
            </button>
            <button onClick={()=>setDeclStep(2)}
              style={{flex:2,padding:9,borderRadius:8,border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",color:"#6b7280",fontSize:12}}>
              تخطي — إدخال يدوي ←
            </button>
          </div>
        </div>
      )}

      {/* ===== خطوة 2: مراجعة وتعديل ===== */}
      {declStep === 2 && (
        <div>
          {/* معاينة الصور */}
          {(licensePreview || carteGrisePreview) && (
            <div style={{display:"flex",gap:8,marginBottom:14}}>
              {licensePreview && (
                <div style={{flex:1,textAlign:"center"}}>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:4}}>🪪 رخصة السياقة</div>
                  <img src={licensePreview} style={{maxHeight:80,maxWidth:"100%",borderRadius:6,border:"1px solid #e5e7eb"}} alt=""/>
                </div>
              )}
              {carteGrisePreview && (
                <div style={{flex:1,textAlign:"center"}}>
                  <div style={{fontSize:10,color:"#6b7280",marginBottom:4}}>🚗 البطاقة الرمادية</div>
                  <img src={carteGrisePreview} style={{maxHeight:80,maxWidth:"100%",borderRadius:6,border:"1px solid #e5e7eb"}} alt=""/>
                </div>
              )}
            </div>
          )}

          {/* بيانات السائق */}
          <div style={{background:"#f0fdf4",borderRadius:10,padding:12,marginBottom:12}}>
            <h6 style={{color:"#1a6b3c",fontWeight:700,fontSize:12,margin:"0 0 10px",borderBottom:"1px solid #d1fae5",paddingBottom:6}}>
              👤 بيانات السائق
            </h6>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[
                ["اللقب (عربي)","nomAr"],["الاسم (عربي)","prenomAr"],
                ["Nom","nom"],["Prénom","prenom"],
                ["NIN","nin"],["الهاتف","telephone"],
                ["رقم الرخصة","numPermis"],["تاريخ الانتهاء","dateExpiration"],
                ["مكان الإصدار","lieuDelivrance"],
              ].map(([label,key])=>(
                <div key={key} style={{display:"flex",flexDirection:"column",gap:3}}>
                  <label style={{fontSize:10,fontWeight:600,color:"#6b7280"}}>{label}</label>
                  <input value={form[key]||""} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}
                    style={{...inp2}} type={key==="dateExpiration"?"date":"text"}/>
                </div>
              ))}
              <div style={{gridColumn:"span 2"}}>
                <label style={{fontSize:10,fontWeight:600,color:"#6b7280",display:"block",marginBottom:4}}>فئات الرخصة</label>
                <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
                  {LICENSE_CATEGORIES.map(cat=>(
                    <button key={cat} onClick={()=>toggleCat(cat)} style={{
                      padding:"4px 10px",borderRadius:16,fontSize:11,fontWeight:600,cursor:"pointer",
                      border:`1.5px solid ${form.categories.includes(cat)?BLUE:"#d1d5db"}`,
                      background:form.categories.includes(cat)?BLUE:"#fff",
                      color:form.categories.includes(cat)?"#fff":"#374151"
                    }}>{cat}</button>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* بيانات المركبة */}
          <div style={{background:"#eff6ff",borderRadius:10,padding:12,marginBottom:14}}>
            <h6 style={{color:BLUE,fontWeight:700,fontSize:12,margin:"0 0 10px",borderBottom:"1px solid #bfdbfe",paddingBottom:6}}>
              🚗 بيانات المركبة
            </h6>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              {[
                ["رقم التسجيل *","numImmatriculation"],["الماركة","marque"],
                ["الطراز","modele"],["نوع المركبة","typeVehicule"],
                ["رقم الهيكل","numSerie"],["عدد المقاعد","nbPlaces"],
                ["سنة أول استعمال","anneeCirculation"],["الرقم السابق","numPrecedent"],
                ["اسم المالك","proprietaireNom"],["لقب المالك","proprietairePrenom"],
              ].map(([label,key])=>(
                <div key={key} style={{display:"flex",flexDirection:"column",gap:3}}>
                  <label style={{fontSize:10,fontWeight:600,color:"#6b7280"}}>{label}</label>
                  <input value={form[key]||""} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))}
                    style={{...inp2}}/>
                </div>
              ))}
            </div>
          </div>

          {/* أزرار */}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setDeclStep(1)}
              style={{flex:1,padding:10,borderRadius:8,border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",fontSize:13,color:"#374151"}}>
              ← رجوع
            </button>
            <button
              onClick={()=>{
                if (!form.numImmatriculation.trim() && !form.nomAr.trim() && !form.nom.trim()) return;
                onAdd({...form, licensePreview, carteGrisePreview});
              }}
              style={{flex:2,padding:10,borderRadius:8,border:"none",background:BLUE,color:"#fff",cursor:"pointer",fontWeight:700,fontSize:13}}>
              ✅ إضافة للجدول
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ==================== جدول التصريحات ====================
function DeclarationsTable({ declarations, onRemove, BLUE }) {
  const [expanded, setExpanded] = useState(null);

  if (declarations.length === 0) return (
    <p style={{color:"#9ca3af",fontSize:13,textAlign:"center",margin:"12px 0"}}>
      لم يُضف أي تصريح بعد — اضغط "+ إضافة تصريح" لبدء التسجيل
    </p>
  );

  return (
    <div style={{overflowX:"auto",borderRadius:10,border:"1px solid #e5e7eb",marginTop:4}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:12,minWidth:700}}>
        <thead>
          <tr style={{background:BLUE+"11"}}>
            {["#","السائق","NIN","رخصة / فئات","رقم التسجيل","المركبة","سنة","",""].map((h,i)=>(
              <th key={i} style={{padding:"9px 10px",textAlign:"right",color:"#374151",fontWeight:700,
                borderBottom:`2px solid ${BLUE}33`,whiteSpace:"nowrap",fontSize:11}}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {declarations.map((d,i)=>(
            <React.Fragment key={i}>
              <tr
                style={{background:i%2===0?"#fff":"#f8faff",cursor:"pointer",transition:"background .15s"}}
                onMouseEnter={e=>e.currentTarget.style.background=BLUE+"0d"}
                onMouseLeave={e=>e.currentTarget.style.background=i%2===0?"#fff":"#f8faff"}>

                {/* رقم */}
                <td style={{padding:"9px 10px",color:"#9ca3af",fontWeight:600}}>{i+1}</td>

                {/* السائق */}
                <td style={{padding:"9px 10px"}}>
                  <div style={{fontWeight:700,color:"#1a6b3c",fontSize:12}}>
                    {d.nomAr||d.nom||"—"} {d.prenomAr||d.prenom||""}
                  </div>
                  {d.telephone&&<div style={{fontSize:10,color:"#6b7280"}}>{d.telephone}</div>}
                  {/* معاينة رخصة صغيرة */}
                  {d.licensePreview&&(
                    <img src={d.licensePreview}
                      style={{height:22,borderRadius:3,border:"1px solid #d1d5db",marginTop:3,cursor:"pointer"}}
                      onClick={()=>setExpanded(expanded===i+"-lic"?null:i+"-lic")}
                      title="رخصة السياقة" alt=""/>
                  )}
                </td>

                {/* NIN */}
                <td style={{padding:"9px 10px",fontFamily:"monospace",fontSize:11,color:"#374151"}}>
                  {d.nin||"—"}
                </td>

                {/* رخصة / فئات */}
                <td style={{padding:"9px 10px"}}>
                  <div style={{fontSize:11,color:"#374151"}}>{d.numPermis||"—"}</div>
                  {d.categories?.length>0&&(
                    <div style={{display:"flex",flexWrap:"wrap",gap:2,marginTop:3}}>
                      {d.categories.map(c=>(
                        <span key={c} style={{padding:"1px 5px",borderRadius:8,background:BLUE+"22",color:BLUE,fontSize:9,fontWeight:700}}>{c}</span>
                      ))}
                    </div>
                  )}
                  {d.dateExpiration&&<div style={{fontSize:9,color:"#9ca3af",marginTop:2}}>انتهاء: {d.dateExpiration}</div>}
                </td>

                {/* رقم التسجيل */}
                <td style={{padding:"9px 10px",fontWeight:700,color:BLUE,fontSize:12}}>
                  {d.numImmatriculation||"—"}
                  {/* معاينة بطاقة رمادية صغيرة */}
                  {d.carteGrisePreview&&(
                    <div>
                      <img src={d.carteGrisePreview}
                        style={{height:22,borderRadius:3,border:"1px solid #d1d5db",marginTop:3,cursor:"pointer"}}
                        onClick={()=>setExpanded(expanded===i+"-cg"?null:i+"-cg")}
                        title="البطاقة الرمادية" alt=""/>
                    </div>
                  )}
                </td>

                {/* المركبة */}
                <td style={{padding:"9px 10px"}}>
                  <div style={{fontSize:12,color:"#374151"}}>{d.marque||"—"} {d.modele||""}</div>
                  {d.typeVehicule&&<div style={{fontSize:10,color:"#6b7280"}}>{d.typeVehicule}</div>}
                  {d.nbPlaces&&<div style={{fontSize:10,color:"#6b7280"}}>{d.nbPlaces} مقاعد</div>}
                </td>

                {/* سنة */}
                <td style={{padding:"9px 10px",color:"#6b7280",fontSize:11}}>
                  {d.anneeCirculation||"—"}
                </td>

                {/* تفاصيل */}
                <td style={{padding:"9px 10px"}}>
                  <button
                    onClick={()=>setExpanded(expanded===i?null:i)}
                    style={{padding:"3px 8px",borderRadius:6,border:`1px solid ${BLUE}44`,
                      background:"#fff",color:BLUE,cursor:"pointer",fontSize:10,fontWeight:600}}>
                    {expanded===i?"▲":"▼"}
                  </button>
                </td>

                {/* حذف */}
                <td style={{padding:"9px 10px"}}>
                  <button onClick={()=>onRemove(i)}
                    style={{padding:"3px 8px",borderRadius:6,border:"1px solid #fca5a5",
                      background:"#fef2f2",color:"#dc2626",cursor:"pointer",fontSize:10}}>
                    حذف
                  </button>
                </td>
              </tr>

              {/* صف التوسيع — معاينة الصور الكبيرة */}
              {expanded===i+"-lic"&&d.licensePreview&&(
                <tr><td colSpan={9} style={{padding:"8px 16px",background:"#f0fdf4",borderBottom:"1px solid #e5e7eb"}}>
                  <img src={d.licensePreview} style={{maxHeight:180,borderRadius:8,border:"1px solid #d1d5db"}} alt="رخصة السياقة"/>
                </td></tr>
              )}
              {expanded===i+"-cg"&&d.carteGrisePreview&&(
                <tr><td colSpan={9} style={{padding:"8px 16px",background:"#eff6ff",borderBottom:"1px solid #e5e7eb"}}>
                  <img src={d.carteGrisePreview} style={{maxHeight:180,borderRadius:8,border:"1px solid #d1d5db"}} alt="البطاقة الرمادية"/>
                </td></tr>
              )}
              {expanded===i&&(
                <tr><td colSpan={9} style={{padding:"10px 16px",background:"#fafafa",borderBottom:"2px solid #e5e7eb"}}>
                  <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"6px 16px",fontSize:11}}>
                    {[
                      ["NIN",d.nin],["رقم الرخصة",d.numPermis],["انتهاء الرخصة",d.dateExpiration],
                      ["مكان الإصدار",d.lieuDelivrance],["العنوان",d.adresse],["رقم الهيكل",d.numSerie],
                      ["الطاقة",d.energie],["القوة",d.puissance],["الرقم السابق",d.numPrecedent],
                      ["اسم المالك",d.proprietaireNom],["لقب المالك",d.proprietairePrenom],["النوع",d.genre],
                    ].filter(([,v])=>v).map(([l,v])=>(
                      <div key={l} style={{display:"flex",gap:6}}>
                        <span style={{color:"#9ca3af",minWidth:80}}>{l}:</span>
                        <span style={{color:"#374151",fontWeight:500}}>{v}</span>
                      </div>
                    ))}
                  </div>
                </td></tr>
              )}
            </React.Fragment>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// ==================== COMPANY FORM ====================
function CompanyForm({ onBack }) {
  const [form, setForm]               = useState(INITIAL_COMPANY_FORM);
  const [declarations, setDeclarations] = useState([]);
  const [saving, setSaving]           = useState(false);
  const [errors, setErrors]           = useState([]);
  const [showDeclForm, setShowDeclForm] = useState(false);
  const [submitted, setSubmitted]     = useState(false);

  const inp = {width:"100%",padding:"10px 12px",border:"1.5px solid #d1d5db",
    borderRadius:8,fontSize:14,outline:"none",boxSizing:"border-box",fontFamily:"inherit",background:"#fff"};
  const BLUE = "#2563eb";

  function validateCompany() {
    const e = [];
    if (!form.nomSociete.trim())       e.push("اسم الشركة مطلوب");
    if (!form.registreCommerce.trim()) e.push("رقم السجل التجاري مطلوب");
    if (!form.telephone.trim())        e.push("رقم الهاتف مطلوب");
    if (!form.wilaya)                  e.push("الولاية مطلوبة");
    if (!form.nomResponsable.trim())   e.push("اسم المسؤول مطلوب");
    return e;
  }

  function addDeclaration(decl) {
    setDeclarations(d => [...d, decl]);
    setShowDeclForm(false);
  }

  function removeDeclaration(idx) { setDeclarations(d => d.filter((_,i) => i !== idx)); }

  async function handleSubmit() {
    const e = validateCompany();
    if (e.length) { setErrors(e); return; }
    setSaving(true);
    try {
      const payload = {
        ...form,
        drivers:   declarations.map(({licensePreview,carteGrisePreview,...rest})=>rest),
        vehicles:  declarations.map(d=>({
          numImmatriculation:d.numImmatriculation, marque:d.marque, modele:d.modele,
          typeVehicule:d.typeVehicule, numSerie:d.numSerie, genre:d.genre,
          energie:d.energie, puissance:d.puissance, nbPlaces:d.nbPlaces,
          anneeCirculation:d.anneeCirculation, numPrecedent:d.numPrecedent,
          proprietaireNom:d.proprietaireNom, proprietairePrenom:d.proprietairePrenom,
        })),
      };
      const res = await fetch(`${API_BASE}/register-company`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(payload)
      });
      const d = await res.json();
      if (d.success) setSubmitted(true);
      else setErrors([d.error || "خطأ في الحفظ"]);
    } catch(err) { setErrors(["خطأ في الاتصال"]); }
    setSaving(false);
  }

  if (submitted) return (
    <div style={{textAlign:"center",padding:"30px 0"}}>
      <div style={{fontSize:60,marginBottom:16}}>✅</div>
      <h3 style={{color:BLUE,fontWeight:800,fontSize:20,marginBottom:8}}>تم تسجيل الشركة بنجاح!</h3>
      <p style={{color:"#6b7280",fontSize:14,marginBottom:6}}>
        <b>{form.nomSociete}</b> — {declarations.length} تصريح (سائق + مركبة)
      </p>
      <button onClick={onBack} style={{padding:"12px 32px",borderRadius:10,border:"none",background:BLUE,color:"#fff",cursor:"pointer",fontWeight:700}}>
        العودة للرئيسية
      </button>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
        <button onClick={onBack} style={{padding:"6px 12px",borderRadius:8,border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",fontSize:13}}>← رجوع</button>
        <h3 style={{color:BLUE,fontWeight:800,fontSize:18,margin:0}}>🏢 تسجيل شركة سيارات الأجرة</h3>
      </div>

      {/* معلومات الشركة */}
      <div style={{background:"#eff6ff",borderRadius:12,padding:16,marginBottom:20}}>
        <h4 style={{color:BLUE,fontWeight:700,fontSize:14,margin:"0 0 12px"}}>📋 معلومات الشركة</h4>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          {[
            ["اسم الشركة *","nomSociete","text"],
            ["رقم السجل التجاري *","registreCommerce","text"],
            ["رقم الاعتماد","numeroAgreement","text"],
            ["اسم المسؤول *","nomResponsable","text"],
            ["لقب المسؤول","prenomResponsable","text"],
            ["الهاتف *","telephone","tel"],
            ["هاتف 2","telephone2","tel"],
            ["البريد الإلكتروني","email","email"],
          ].map(([label,key,type])=>(
            <div key={key} style={{display:"flex",flexDirection:"column",gap:4}}>
              <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>{label}</label>
              <input type={type} value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))} style={inp}/>
            </div>
          ))}
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>الولاية *</label>
            <select value={form.wilaya} onChange={e=>setForm(f=>({...f,wilaya:e.target.value}))} style={inp}>
              <option value="">اختر الولاية</option>
              {WILAYAS.map(w=><option key={w} value={w}>{w}</option>)}
            </select>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>عدد المركبات</label>
            <input type="number" value={form.nbVehicules} onChange={e=>setForm(f=>({...f,nbVehicules:e.target.value}))} style={inp}/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4,gridColumn:"span 2"}}>
            <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>العنوان</label>
            <input value={form.adresse} onChange={e=>setForm(f=>({...f,adresse:e.target.value}))} style={inp}/>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:4,gridColumn:"span 2"}}>
            <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>ملاحظات</label>
            <textarea value={form.notes} onChange={e=>setForm(f=>({...f,notes:e.target.value}))} rows={2} style={{...inp,resize:"vertical"}}/>
          </div>
        </div>
      </div>

      {/* ===== قسم التصريحات (سائق + مركبة) ===== */}
      <div style={{background:"#f0f4ff",borderRadius:12,padding:16,marginBottom:20,border:"1.5px solid #bfdbfe"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
          <div>
            <h4 style={{color:BLUE,fontWeight:700,fontSize:14,margin:0}}>
              📋 التصريح بالسائقين والمركبات ({declarations.length})
            </h4>
            <p style={{color:"#6b7280",fontSize:11,margin:"3px 0 0"}}>
              كل سائق مع مركبته في سطر واحد — رخصة السياقة + البطاقة الرمادية
            </p>
          </div>
          {!showDeclForm&&(
            <button
              onClick={()=>setShowDeclForm(true)}
              style={{padding:"8px 16px",borderRadius:8,border:"none",background:BLUE,
                color:"#fff",cursor:"pointer",fontWeight:700,fontSize:13,whiteSpace:"nowrap"}}>
              + إضافة تصريح
            </button>
          )}
        </div>

        {/* الجدول */}
        <DeclarationsTable declarations={declarations} onRemove={removeDeclaration} BLUE={BLUE}/>

        {/* نموذج التصريح */}
        {showDeclForm&&(
          <DeclarationForm
            onAdd={addDeclaration}
            onCancel={()=>setShowDeclForm(false)}
            BLUE={BLUE}
          />
        )}
      </div>

      {/* أخطاء */}
      {errors.length>0&&(
        <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"10px 14px",marginBottom:12}}>
          {errors.map(e=><div key={e} style={{color:"#dc2626",fontSize:13,marginBottom:3}}>⚠️ {e}</div>)}
        </div>
      )}

      <button onClick={handleSubmit} disabled={saving}
        style={{width:"100%",padding:14,borderRadius:10,border:"none",
          background:saving?"#93c5fd":BLUE,color:"#fff",cursor:saving?"default":"pointer",fontWeight:700,fontSize:15}}>

// ==================== SEAT BOOKLET FORM (دفتر المقاعد) ====================

    borderRadius:8,fontSize:14,outline:"none",boxSizing:"border-box",fontFamily:"inherit",background:"#fff"};

      borderRadius:6,padding:"5px 10px",marginTop:18,marginBottom:8,gridColumn:"span 2"}}>{children}</div>;

    if (!form.telephone.trim()) e.push("رقم الهاتف مطلوب");

// ==================== HERITAGE LICENSE FORM ====================
const INITIAL_HERITAGE_FORM = {
  nomAr:"", prenomAr:"", nom:"", prenom:"",
  dateNaissance:"", lieuNaissance:"", wilayaNaissance:"",
  adresse:"", commune:"", wilaya:"", nin:"",
  numDecision:"", dateDecision:"", communeRattachement:"", numPorte:"",
};

function HeritageLicenseForm({ onBack }) {
  // الخطوات: 0=OCR بطاقة التعريف, 1=OCR القرار, 2=مراجعة البيانات, 3=تأكيد
  const [step, setStep]         = useState(0);
  const [form, setForm]         = useState(INITIAL_HERITAGE_FORM);
  const [previewId, setPreviewId]   = useState(null);
  const [previewDec, setPreviewDec] = useState(null);
  const [ocrLoading, setOcrLoading] = useState(false);
  const [ocrErr, setOcrErr]         = useState("");
  const [saving, setSaving]         = useState(false);
  const [errors, setErrors]         = useState([]);
  const [saved, setSaved]           = useState(false);
  const fileRefId  = useRef();
  const fileRefDec = useRef();

  const PURPLE = "#7c3aed";
  const inp = {width:"100%",padding:"10px 12px",border:"1.5px solid #d1d5db",
    borderRadius:8,fontSize:14,outline:"none",boxSizing:"border-box",fontFamily:"inherit",background:"#fff"};

  // OCR بطاقة التعريف الوطنية
  async function handleIdCard(file) {
    if (!file) return;
    setOcrErr(""); setOcrLoading(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      const b64  = e.target.result.split(",")[1];
      const mime = file.type || "image/jpeg";
      setPreviewId(e.target.result);
      try {
        const res = await fetch(`${API_BASE}/ocr-id-card`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({image_base64: b64, mime_type: mime})
        });
        const d = await res.json();
        if (d.success) {
          setForm(f=>({...f,...Object.fromEntries(Object.entries(d.data).filter(([,v])=>v!==""))}));
        } else {
          setOcrErr(d.error || "فشل OCR بطاقة التعريف");
        }
      } catch(err) { setOcrErr("خطأ في الاتصال"); }
      setOcrLoading(false);
      setStep(1);
    };
    reader.readAsDataURL(file);
  }

  // OCR نسخة القرار
  async function handleDecision(file) {
    if (!file) return;
    setOcrErr(""); setOcrLoading(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      const b64  = e.target.result.split(",")[1];
      const mime = file.type || "image/jpeg";
      setPreviewDec(e.target.result);
      try {
        const res = await fetch(`${API_BASE}/ocr-decision`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({image_base64: b64, mime_type: mime})
        });
        const d = await res.json();
        if (d.success) {
          setForm(f=>({...f,...Object.fromEntries(Object.entries(d.data).filter(([,v])=>v!==""))}));
        } else {
          setOcrErr(d.error || "فشل OCR القرار");
        }
      } catch(err) { setOcrErr("خطأ في الاتصال"); }
      setOcrLoading(false);
      setStep(2);
    };
    reader.readAsDataURL(file);
  }

  function validate() {
    const e = [];
    if (!form.nomAr.trim())                e.push("اللقب (عربي) مطلوب");
    if (!form.prenomAr.trim())             e.push("الاسم (عربي) مطلوب");
    if (!form.nin.trim())                  e.push("رقم التعريف الوطني مطلوب");
    if (!form.numDecision.trim())          e.push("رقم القرار مطلوب");
    if (!form.dateDecision.trim())         e.push("تاريخ القرار مطلوب");
    if (!form.communeRattachement.trim())  e.push("بلدية الالحاق مطلوبة");
    if (!form.numPorte.trim())             e.push("رقم الباب مطلوب");
    return e;
  }

  async function handleSubmit() {
    const e = validate();
    if (e.length) { setErrors(e); return; }
    setSaving(true);
    try {
      const res = await fetch(`${API_BASE}/register-heritage-license`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(form)
      });
      const d = await res.json();
      if (d.success) setSaved(true);
      else setErrors([d.error || "خطأ في الحفظ"]);
    } catch(err) { setErrors(["خطأ في الاتصال"]); }
    setSaving(false);
  }

  if (saved) return (
    <div style={{textAlign:"center",padding:"30px 0"}}>
      <div style={{fontSize:60,marginBottom:16}}>✅</div>
      <h3 style={{color:PURPLE,fontWeight:800,fontSize:20,marginBottom:8}}>تم التسجيل بنجاح!</h3>
      <p style={{color:"#6b7280",fontSize:14,marginBottom:4}}>{form.nomAr} {form.prenomAr}</p>
      <p style={{color:"#9ca3af",fontSize:13,marginBottom:24}}>رقم القرار: <b>{form.numDecision}</b></p>
      <button onClick={onBack} style={{padding:"12px 32px",borderRadius:10,border:"none",
        background:PURPLE,color:"#fff",cursor:"pointer",fontWeight:700}}>
        العودة للرئيسية
      </button>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
        <button onClick={onBack} style={{padding:"6px 12px",borderRadius:8,
          border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",fontSize:13}}>← رجوع</button>
        <h3 style={{color:PURPLE,fontWeight:800,fontSize:17,margin:0}}>
          📜 تسجيل رخصة استغلال سيارة أجرة — ذوو الحقوق
        </h3>
      </div>

      {/* خطوة 0: رفع بطاقة التعريف الوطنية */}
      {step===0&&(
        <div>
          <p style={{color:"#6b7280",fontSize:13,marginBottom:14,textAlign:"center"}}>
            ارفع صورة بطاقة التعريف الوطنية لاستخراج البيانات تلقائياً
          </p>
          <div onClick={()=>!ocrLoading&&fileRefId.current.click()}
            onDragOver={e=>e.preventDefault()}
            onDrop={e=>{e.preventDefault();handleIdCard(e.dataTransfer.files[0]);}}
            style={{border:`2px dashed ${PURPLE}`,borderRadius:14,padding:"30px 16px",
              textAlign:"center",cursor:ocrLoading?"default":"pointer",
              background:"#faf5ff",marginBottom:12}}>
            {ocrLoading ? (
              <div style={{color:PURPLE,fontSize:13}}>
                <div style={{width:30,height:30,border:`3px solid ${PURPLE}`,borderTopColor:"transparent",
                  borderRadius:"50%",animation:"spin 1s linear infinite",margin:"0 auto 10px"}}/>
                جاري استخراج البيانات...
              </div>
            ) : previewId ? (
              <img src={previewId} style={{maxHeight:150,maxWidth:"100%",borderRadius:8}} alt="بطاقة تعريف"/>
            ) : (
              <div style={{color:"#9ca3af",fontSize:14}}>
                <div style={{fontSize:40,marginBottom:8}}>🪪</div>
                اضغط أو اسحب صورة بطاقة التعريف الوطنية
              </div>
            )}
          </div>
          <input ref={fileRefId} type="file" accept="image/*" style={{display:"none"}}
            onChange={e=>handleIdCard(e.target.files[0])}/>
          {ocrErr&&<div style={{color:"#dc2626",fontSize:12,marginBottom:8}}>⚠️ {ocrErr}</div>}
          <button onClick={()=>setStep(1)} style={{width:"100%",marginTop:8,padding:10,
            borderRadius:8,border:`1.5px solid ${PURPLE}`,background:"#fff",
            cursor:"pointer",color:PURPLE,fontWeight:600,fontSize:13}}>

      {/* خطوة 1: البيانات الكاملة */}
      {step===1&&(

          {/* بيانات بطاقة التعريف */}
          <div style={{background:"#faf5ff",borderRadius:10,padding:"14px",marginBottom:16,
            border:`1px solid ${PURPLE}33`}}>
            <h4 style={{color:PURPLE,fontWeight:700,fontSize:13,margin:"0 0 12px"}}>
              🪪 بيانات بطاقة التعريف الوطنية
            </h4>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {[
                ["اللقب (عربي) *","nomAr"],["الاسم (عربي) *","prenomAr"],
                ["Nom","nom"],["Prénom","prenom"],
                ["تاريخ الميلاد","dateNaissance","date"],["مكان الميلاد","lieuNaissance"],
                ["ولاية الميلاد","wilayaNaissance"],
                ["رقم التعريف الوطني (NIN) *","nin"],
              ].map(([label,key,type="text"])=>(
                <div key={key} style={{display:"flex",flexDirection:"column",gap:4}}>
                  <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>{label}</label>
                  <input type={type} value={form[key]||""} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))} style={inp}/>
                </div>
              ))}
              <div style={{display:"flex",flexDirection:"column",gap:4,gridColumn:"span 2"}}>
                <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>العنوان</label>
                <input value={form.adresse||""} onChange={e=>setForm(f=>({...f,adresse:e.target.value}))} style={inp}/>
              </div>
              {[["البلدية","commune"],["الولاية","wilaya"]].map(([label,key])=>(
                <div key={key} style={{display:"flex",flexDirection:"column",gap:4}}>
                  <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>{label}</label>
                  <input value={form[key]||""} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))} style={inp}/>
                </div>
              ))}
            </div>
          </div>

          {/* بيانات رخصة الاستغلال */}
          <div style={{background:"#ede9fe",borderRadius:10,padding:"14px",marginBottom:16,
            border:`1px solid ${PURPLE}55`}}>
            <h4 style={{color:PURPLE,fontWeight:700,fontSize:13,margin:"0 0 12px"}}>
              📜 بيانات رخصة الاستغلال
            </h4>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              {[
                ["رقم القرار *","numDecision"],
                ["تاريخ القرار *","dateDecision","date"],
                ["بلدية الالحاق *","communeRattachement"],
                ["رقم الباب *","numPorte"],
              ].map(([label,key,type="text"])=>(
                <div key={key} style={{display:"flex",flexDirection:"column",gap:4}}>
                  <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>{label}</label>
                  <input type={type} value={form[key]||""} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))} style={inp}/>
                </div>
              ))}
            </div>
          </div>

          {errors.length>0&&(
            <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,
              padding:"10px 14px",marginBottom:14}}>
              {errors.map(e=><div key={e} style={{color:"#dc2626",fontSize:13,marginBottom:3}}>⚠️ {e}</div>)}
            </div>
          )}

          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setStep(0)} style={{flex:1,padding:13,borderRadius:10,
              border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",
              fontWeight:600,color:"#374151"}}>← رجوع</button>
            <button onClick={handleSubmit} disabled={saving} style={{flex:2,padding:13,
              borderRadius:10,border:"none",background:saving?"#c4b5fd":PURPLE,
              color:"#fff",cursor:saving?"default":"pointer",fontWeight:700,fontSize:15}}>
              {saving?"جارٍ الحفظ...":"✅ تأكيد التسجيل"}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ==================== ADMIN PASSWORD MODAL ====================
function AdminPasswordModal({ onSuccess, onClose }) {
  const [pw, setPw]           = useState("");
  const [err, setErr]         = useState("");
  const [loading, setLoading] = useState(false);

  async function handleCheck() {
    if (!pw.trim()) { setErr("أدخل كلمة المرور"); return; }
    setLoading(true);
    try {
      const res = await fetch(`${API_BASE}/admin/login`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({password: pw})
      });
      const d = await res.json();
      if (d.success) { onSuccess(); }
      else { setErr("كلمة المرور غير صحيحة"); }
    } catch(e) { setErr("خطأ في الاتصال بالخادم"); }
    setLoading(false);
  }

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:3000,
      display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#fff",borderRadius:18,padding:"32px 28px",maxWidth:360,width:"100%",
        boxShadow:"0 8px 40px rgba(0,0,0,.18)"}} dir="rtl">
        <div style={{textAlign:"center",marginBottom:20}}>
          <div style={{fontSize:40,marginBottom:8}}>🔐</div>
          <h3 style={{margin:0,color:"#1a6b3c",fontSize:17,fontWeight:800}}>لوحة الإدارة</h3>
          <p style={{color:"#6b7280",fontSize:13,margin:"6px 0 0"}}>أدخل كلمة المرور للمتابعة</p>
        </div>
        <input
          type="password" value={pw}
          onChange={e=>{setPw(e.target.value);setErr("");}}
          onKeyDown={e=>e.key==="Enter"&&handleCheck()}
          placeholder="كلمة المرور" autoFocus
          style={{width:"100%",padding:"12px 14px",
            border:`1.5px solid ${err?"#dc2626":"#d1d5db"}`,
            borderRadius:10,fontSize:15,outline:"none",fontFamily:"inherit",
            textAlign:"center",letterSpacing:4,marginBottom:8}}
        />
        {err&&<div style={{color:"#dc2626",fontSize:13,marginBottom:10,textAlign:"center"}}>⚠️ {err}</div>}
        <div style={{display:"flex",gap:10,marginTop:8}}>
          <button onClick={onClose} style={{flex:1,padding:12,borderRadius:10,
            border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",
            fontWeight:600,color:"#374151",fontSize:14}}>إلغاء</button>
          <button onClick={handleCheck} disabled={loading} style={{flex:2,padding:12,borderRadius:10,
            border:"none",background:loading?"#86efac":"#1a6b3c",color:"#fff",
            cursor:loading?"default":"pointer",fontWeight:700,fontSize:14}}>
            {loading?"جارٍ التحقق...":"دخول ←"}
          </button>
        </div>
      </div>
    </div>
  );
}

// ==================== MAIN APP ====================
function App() {
  const [page, setPage]           = useState("landing");
  const [step, setStep]           = useState(0);
  const [form, setForm]           = useState(INITIAL_FORM);
  const [preview, setPreview]     = useState(null);
  const [errors, setErrors]       = useState([]);
  const [saving, setSaving]       = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [showAdminPw, setShowAdminPw] = useState(false);

  function reset() { setStep(0); setForm(INITIAL_FORM); setPreview(null); setErrors([]); }

  function handleExtracted(data, prev) {
    if (data) setForm(f => ({ ...f, ...Object.fromEntries(Object.entries(data).filter(([,v])=>v!==undefined&&v!=="")) }));
    setPreview(prev);
    setStep(1);
  }

  function validate() {
    const e = [];
    if (!form.nomAr.trim())        e.push("اللقب (عربي) مطلوب");
    if (!form.prenomAr.trim())     e.push("الاسم (عربي) مطلوب");
    if (!form.nin.trim())          e.push("رقم التعريف الوطني مطلوب");
    if (!form.numPermis.trim())    e.push("رقم رخصة السياقة مطلوب");
    if (!form.dateExpiration)      e.push("تاريخ انتهاء الرخصة مطلوب");
    if (form.categories.length===0) e.push("يجب اختيار فئة واحدة على الأقل");
    return e;
  }

  async function handleSubmit() {
    const e = validate();
    if (e.length) { setErrors(e); return; }
    setSaving(true);
    try {
      const res = await fetch(`${API_BASE}/register`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(form)
      });
      const d = await res.json();
      if (d.success) setStep(2);
      else setErrors([d.error || "خطأ في الحفظ"]);
    } catch(err) {
      setErrors(["خطأ في الاتصال بالخادم"]);
    }
    setSaving(false);
  }

  const headerColor = page==="company" ? "#2563eb"
                    : page==="booklet"  ? "#b45309"
                    : page==="heritage" ? "#7c3aed"
                    : "#1a6b3c";
  const headerTitle = page==="company"  ? "تسجيل شركة سيارات الأجرة"
                    : page==="booklet"  ? "التسجيل لنيل دفتر المقاعد"
                    : page==="heritage" ? "رخصة استغلال — ذوو الحقوق"
                    : "تسجيل سائقي سيارات الأجرة";
  const headerSub = "مركز التكوين — نقل الأشخاص";

  return (
    <div style={{minHeight:"100vh",background:"#f0fdf4",fontFamily:"Segoe UI,Tahoma,Arial,sans-serif"}} dir="rtl">
      <style>{`@keyframes spin{to{transform:rotate(360deg)}} *{box-sizing:border-box}`}</style>

      {/* Header */}
      <div style={{background:headerColor,boxShadow:"0 2px 8px rgba(0,0,0,.15)"}}>
        <div style={{maxWidth:660,margin:"0 auto",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:58}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:22}}>{page==="company"?"🏢":page==="booklet"?"📘":page==="heritage"?"📜":"🚕"}</span>
            <div>
              <div style={{color:"#fff",fontWeight:700,fontSize:14}}>{headerTitle}</div>
              <div style={{color:"rgba(255,255,255,.75)",fontSize:11}}>{headerSub}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {page!=="landing"&&(
              <button onClick={()=>{setPage("landing");reset();}} style={{padding:"6px 12px",borderRadius:8,border:"1px solid rgba(255,255,255,.3)",background:"rgba(255,255,255,.1)",color:"#fff",cursor:"pointer",fontSize:12}}>
                🏠 الرئيسية
              </button>
            )}
            <button onClick={()=>setShowAdminPw(true)} style={{padding:"6px 13px",borderRadius:8,border:"1px solid rgba(255,255,255,.3)",background:"rgba(255,255,255,.1)",color:"#fff",cursor:"pointer",fontSize:12}}>
              🗂️ الإدارة
            </button>
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:660,margin:"0 auto",padding:"28px 14px"}}>
        <div style={{background:"#fff",borderRadius:20,boxShadow:"0 4px 24px rgba(0,0,0,.07)",padding:"28px 24px"}}>

          {/* Landing */}
          {page==="landing"&&<LandingPage onSelect={p=>{setPage(p);reset();}}/>}

          {/* Company */}
          {page==="company"&&<CompanyForm onBack={()=>{setPage("landing");reset();}}/>}

          {/* Seat Booklet */}
          {page==="booklet"&&<SeatBookletForm onBack={()=>{setPage("landing");reset();}}/>}

          {/* Heritage License */}
          {page==="heritage"&&<HeritageLicenseForm onBack={()=>{setPage("landing");reset();}}/>}

          {/* Driver */}
          {page==="driver"&&<>
            {step<3&&<StepBar step={step}/>}

            {/* خطوة 0: رفع رخصة السياقة + البطاقة الرمادية معاً */}
            {step===0&&<UploadDocuments onDone={(permisData, griseData, preview)=>{
              const merged = {};
              if (permisData) Object.entries(permisData).forEach(([k,v])=>{ if(v!=="") merged[k]=v; });
              if (griseData)  Object.entries(griseData).forEach(([k,v])=>{ if(v!=="") merged[k]=v; });
              setForm(f=>({...f,...merged}));
              setPreview(preview);
              setStep(1);
            }}/>}

            {/* خطوة 1: مراجعة البيانات */}
            {step===1&&<>
              <ReviewStep form={form} setForm={setForm} preview={preview}/>
              <ReviewVehicle form={form} setForm={setForm}/>
              {errors.length>0&&(
                <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"10px 14px",marginTop:14}}>
                  {errors.map(e=><div key={e} style={{color:"#dc2626",fontSize:13,marginBottom:3}}>⚠️ {e}</div>)}
                </div>
              )}
              <div style={{display:"flex",gap:10,marginTop:22}}>
                <button onClick={()=>setStep(1)} style={{flex:1,padding:13,borderRadius:10,border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",fontWeight:600,color:"#374151"}}>← رجوع</button>
                <button onClick={handleSubmit} disabled={saving} style={{flex:2,padding:13,borderRadius:10,border:"none",background:saving?"#86efac":"#1a6b3c",color:"#fff",cursor:saving?"default":"pointer",fontWeight:700,fontSize:15}}>
                  {saving?"جارٍ الإرسال...":"✅ تأكيد التسجيل"}
                </button>
              </div>
            </>}

            {/* خطوة 3: تأكيد */}
            {step===2&&<>
              <ConfirmStep form={form} preview={preview}/>
              <button onClick={reset} style={{width:"100%",marginTop:18,padding:13,borderRadius:10,border:"none",background:"#1a6b3c",color:"#fff",cursor:"pointer",fontWeight:700,fontSize:15}}>
                + تسجيل مترشح آخر
              </button>
            </>}
          </>}

        </div>
        <p style={{textAlign:"center",color:"#9ca3af",fontSize:12,marginTop:18}}>
          بياناتك محفوظة بشكل آمن على خادم المركز
        </p>
      </div>

      {showAdminPw&&(
        <AdminPasswordModal
          onSuccess={()=>{ setShowAdminPw(false); setShowAdmin(true); }}
          onClose={()=>setShowAdminPw(false)}
        />
      )}
      {showAdmin&&<AdminPanel onClose={()=>setShowAdmin(false)}/>}
    </div>
  );
}

// ═══ frontend/09_boot.js ═══
ReactDOM.render(React.createElement(App), document.getElementById('root'));

</script>
</body>
