<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل سائقي سيارات الأجرة</title>
<script src="/static/react.js"></script>
<script src="/static/react-dom.js"></script>
<script src="/static/babel.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: linear-gradient(135deg,#f0fdf4,#ecfdf5,#f9fafb); min-height: 100vh; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="/static/app.js" data-presets="react"></script>
<script>
// fallback: إن لم يُحمَّل app.js، أظهر رسالة خطأ
window.addEventListener("error", function(e) {
  if (document.getElementById("root").innerHTML === "") {
    document.getElementById("root").innerHTML =
      '<div style="text-align:center;padding:40px;color:#dc2626">خطأ في تحميل التطبيق — أعد تشغيل الخادم</div>';
  }
});
</script>
</body>
</html>
