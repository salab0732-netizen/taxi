// ==================== OCR ====================
// ملاحظة: الاستخراج يمر عبر السيرفر الخلفي (/api/ocr) الذي يحمّل مفتاح
// Gemini من backend/gemini_key.txt على الخادم فقط — لا يوجد أي مفتاح
// مكشوف هنا في كود الواجهة الأمامية.
async function extractCarteGriseData(base64Image, mimeType) {
  const res = await fetch(`${API_BASE}/ocr-carte-grise`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image_base64: base64Image, mime_type: mimeType })
  });
  const d = await res.json();
  if (!d.success) { console.error("OCR carte grise error:", d.error); return null; }
  return d.data;
}

async function extractLicenseData(base64Image, mimeType) {
  const res = await fetch(`${API_BASE}/ocr`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ image_base64: base64Image, mime_type: mimeType })
  });
  const d = await res.json();
  if (!d.success) {
    console.error("OCR error:", d.error);
    return null;
  }
  return d.data;
}

// ==================== UPLOAD DOCUMENTS (رخصة + بطاقة رمادية) ====================
function UploadDocuments({ onDone }) {
  const [permisImg,   setPermisImg]   = useState(null); // base64 preview
  const [permisB64,   setPermisB64]   = useState("");
  const [permisData,  setPermisData]  = useState(null);
  const [permisLoad,  setPermisLoad]  = useState(false);
  const [permisErr,   setPermisErr]   = useState("");

  const [griseImg,    setGriseImg]    = useState(null);
  const [griseB64,    setGriseB64]    = useState("");
  const [griseData,   setGriseData]   = useState(null);
  const [griseLoad,   setGriseLoad]   = useState(false);
  const [griseErr,    setGriseErr]    = useState("");

  const permisRef = useRef();
  const griseRef  = useRef();

  async function handlePermis(file) {
    if (!file) return;
    setPermisErr(""); setPermisLoad(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      const b64  = e.target.result.split(",")[1];
      const mime = file.type || "image/jpeg";
      setPermisImg(e.target.result);
      setPermisB64(b64);
      try {
        const res = await fetch(`${API_BASE}/ocr`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({image_base64: b64, mime_type: mime})
        });
        const d = await res.json();
        if (d.success) setPermisData(d.data);
        else setPermisErr(d.error || "فشل استخراج بيانات الرخصة");
      } catch(e) { setPermisErr("خطأ في الاتصال"); }
      setPermisLoad(false);
    };
    reader.readAsDataURL(file);
  }

  async function handleGrise(file) {
    if (!file) return;
    setGriseErr(""); setGriseLoad(true);
    const reader = new FileReader();
    reader.onload = async (e) => {
      const b64  = e.target.result.split(",")[1];
      const mime = file.type || "image/jpeg";
      setGriseImg(e.target.result);
      setGriseB64(b64);
      try {
        const res = await fetch(`${API_BASE}/ocr-carte-grise`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({image_base64: b64, mime_type: mime})
        });
        const d = await res.json();
        if (d.success) setGriseData(d.data);
        else setGriseErr(d.error || "فشل استخراج بيانات البطاقة الرمادية");
      } catch(e) { setGriseErr("خطأ في الاتصال"); }
      setGriseLoad(false);
    };
    reader.readAsDataURL(file);
  }

  function handleContinue() {
    onDone(permisData, griseData, permisImg);
  }

  const cardStyle = {
    border:"2px dashed #d1d5db", borderRadius:14, padding:"16px 12px",
    textAlign:"center", cursor:"pointer", background:"#f9fafb",
    marginBottom:12, transition:"border-color .2s"
  };
  const cardActiveStyle = {...cardStyle, borderColor:"#1a6b3c", background:"#f0fdf4"};

  function ResultBadge({ data, label }) {
    if (!data) return null;
    const fields = Object.entries(data).filter(([,v])=>v&&v!==""&&!(Array.isArray(v)&&v.length===0));
    return (
      <div style={{background:"#f0fdf4",border:"1px solid #86efac",borderRadius:8,
        padding:"8px 12px",marginTop:8,textAlign:"right"}}>
        <div style={{color:"#15803d",fontWeight:700,fontSize:12,marginBottom:4}}>
          ✅ تم استخراج {fields.length} حقل
        </div>
        <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
          {fields.slice(0,6).map(([k,v])=>(
            <span key={k} style={{background:"#dcfce7",color:"#166534",
              padding:"2px 6px",borderRadius:4,fontSize:11}}>
              {Array.isArray(v)?v.join(","): String(v).slice(0,15)}
            </span>
          ))}
          {fields.length>6&&<span style={{color:"#6b7280",fontSize:11}}>+{fields.length-6} أخرى</span>}
        </div>
      </div>
    );
  }

  return (
    <div>
      <h3 style={{color:"#1a6b3c",fontWeight:800,fontSize:17,marginBottom:20,textAlign:"center"}}>
        📄 رفع وثائق السائق
      </h3>

      {/* رخصة السياقة */}
      <div style={{marginBottom:20}}>
        <div style={{fontWeight:700,fontSize:14,color:"#374151",marginBottom:8}}>
          🪪 رخصة السياقة
        </div>
        <div onClick={()=>!permisLoad&&permisRef.current.click()}
          style={permisImg ? cardActiveStyle : cardStyle}>
          {permisLoad ? (
            <div style={{color:"#1a6b3c",fontSize:13}}>
              <div style={{width:28,height:28,border:"3px solid #1a6b3c",
                borderTopColor:"transparent",borderRadius:"50%",
                animation:"spin 1s linear infinite",margin:"0 auto 8px"}}/>
              جاري قراءة الرخصة...
            </div>
          ) : permisImg ? (
            <img src={permisImg} style={{maxHeight:120,maxWidth:"100%",borderRadius:6}} alt="رخصة"/>
          ) : (
            <div style={{color:"#9ca3af",fontSize:13}}>
              <div style={{fontSize:32,marginBottom:6}}>🪪</div>
              اضغط لرفع صورة رخصة السياقة
            </div>
          )}
        </div>
        <input ref={permisRef} type="file" accept="image/*" style={{display:"none"}}
          onChange={e=>handlePermis(e.target.files[0])}/>
        {permisErr && <div style={{color:"#dc2626",fontSize:12,marginTop:4}}>⚠️ {permisErr}</div>}
        <ResultBadge data={permisData} label="رخصة"/>
      </div>

      {/* البطاقة الرمادية */}
      <div style={{marginBottom:20}}>
        <div style={{fontWeight:700,fontSize:14,color:"#374151",marginBottom:8}}>
          🚗 البطاقة الرمادية
        </div>
        <div onClick={()=>!griseLoad&&griseRef.current.click()}
          style={griseImg ? {...cardStyle,borderColor:"#2563eb",background:"#eff6ff"} : cardStyle}>
          {griseLoad ? (
            <div style={{color:"#2563eb",fontSize:13}}>
              <div style={{width:28,height:28,border:"3px solid #2563eb",
                borderTopColor:"transparent",borderRadius:"50%",
                animation:"spin 1s linear infinite",margin:"0 auto 8px"}}/>
              جاري قراءة البطاقة الرمادية...
            </div>
          ) : griseImg ? (
            <img src={griseImg} style={{maxHeight:120,maxWidth:"100%",borderRadius:6}} alt="بطاقة رمادية"/>
          ) : (
            <div style={{color:"#9ca3af",fontSize:13}}>
              <div style={{fontSize:32,marginBottom:6}}>🚗</div>
              اضغط لرفع صورة البطاقة الرمادية
            </div>
          )}
        </div>
        <input ref={griseRef} type="file" accept="image/*" style={{display:"none"}}
          onChange={e=>handleGrise(e.target.files[0])}/>
        {griseErr && <div style={{color:"#dc2626",fontSize:12,marginTop:4}}>⚠️ {griseErr}</div>}
        <ResultBadge data={griseData} label="بطاقة رمادية"/>
      </div>

      <button onClick={handleContinue}
        style={{width:"100%",padding:13,borderRadius:10,border:"none",
          background:"#1a6b3c",color:"#fff",cursor:"pointer",fontWeight:700,fontSize:15}}>
        متابعة لمراجعة البيانات ←
      </button>
      <p style={{textAlign:"center",color:"#9ca3af",fontSize:12,marginTop:8}}>
        يمكنك المتابعة حتى بدون رفع الوثائق — ستُدخل البيانات يدوياً
      </p>
    </div>
  );
}

function Field({ label, required, hint, children }) {
  return (
    <div style={{marginBottom:14}}>
      <label style={{display:"block",fontSize:13,fontWeight:600,color:"#374151",marginBottom:5}}>
        {label}{required&&<span style={{color:"#dc2626"}}> *</span>}
      </label>
      {children}
      {hint&&<p style={{fontSize:11,color:"#9ca3af",margin:"3px 0 0"}}>{hint}</p>}
    </div>
  );
}

// ---- Step 1 ----
function UploadStep({ onDone }) {
  const [drag,setDrag]=useState(false);
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [preview,setPreview]=useState(null);
  const ref=useRef();

  const process=useCallback(async(file)=>{
    if(!file?.type.startsWith("image/")){setError("يرجى رفع صورة صالحة (JPG، PNG)");return;}
    setError("");setLoading(true);
    const reader=new FileReader();
    reader.onload=async(e)=>{
      const dataUrl=e.target.result;
      setPreview(dataUrl);
      const b64=dataUrl.split(",")[1];
      try{
        const extracted=await extractLicenseData(b64,file.type);
        onDone(extracted||{},b64,dataUrl);
      }catch{
        setError("تعذّر استخراج البيانات — يمكنك إدخالها يدوياً.");
        onDone({},b64,dataUrl);
      }
      setLoading(false);
    };
    reader.readAsDataURL(file);
  },[onDone]);

  return (
    <div>
      <div
        onClick={()=>!loading&&ref.current?.click()}
        onDragOver={e=>{e.preventDefault();setDrag(true);}}
        onDragLeave={()=>setDrag(false)}
        onDrop={e=>{e.preventDefault();setDrag(false);process(e.dataTransfer.files[0]);}}
        style={{
          border:`2px dashed ${drag?"#2d9e5f":"#d1d5db"}`,borderRadius:16,
          padding:"40px 20px",textAlign:"center",cursor:loading?"default":"pointer",
          background:drag?"#f0fdf4":"#fafafa",transition:"all .2s"
        }}>
        {preview
          ? <img src={preview} alt="" style={{maxHeight:200,maxWidth:"100%",borderRadius:8,objectFit:"contain"}}/>
          : <>
              <div style={{fontSize:52,marginBottom:10}}>🪪</div>
              <p style={{color:"#374151",fontWeight:600,fontSize:15,margin:"0 0 6px"}}>ارفع صورة رخصة السياقة</p>
              <p style={{color:"#9ca3af",fontSize:13,margin:0}}>الرخصة الورقية أو البطاقة البيومترية — JPG، PNG</p>
            </>
        }
        <input ref={ref} type="file" accept="image/*" style={{display:"none"}}
          onChange={e=>process(e.target.files[0])}/>
      </div>

      {loading&&(
        <div style={{textAlign:"center",marginTop:24}}>
          <div style={{display:"inline-block",width:40,height:40,border:"3px solid #e5e7eb",borderTopColor:"#2d9e5f",borderRadius:"50%",animation:"spin .8s linear infinite"}}/>
          <p style={{color:"#2d9e5f",marginTop:10,fontWeight:600}}>جارٍ استخراج البيانات...</p>
        </div>
      )}
      {error&&<div style={{marginTop:14,padding:"10px 14px",background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,color:"#dc2626",fontSize:13}}>{error}</div>}
      <div style={{marginTop:18,padding:"12px 14px",background:"#eff6ff",borderRadius:10,fontSize:13,color:"#1d4ed8"}}>
        💡 تأكد من وضوح الصورة وإضاءة جيدة — يمكنك تصحيح أي بيانات في الخطوة التالية.
      </div>
    </div>
  );
}

      {/* التواصل */}
      <h3 style={{fontSize:13,fontWeight:700,color:"#1a6b3c",borderBottom:"2px solid #d1fae5",paddingBottom:7,marginBottom:14,marginTop:22}}>📞 معلومات التواصل</h3>

  const fetchData=async()=>{
    setLoading(true);
    try{
      const [cRes,sRes]=await Promise.all([
        fetch(`${API_BASE}/admin/candidates?q=${encodeURIComponent(search)}&statut=${statut}&limit=100`),
        fetch(`${API_BASE}/stats`)
      ]);
      setData(await cRes.json());
      setStats(await sRes.json());

    setLoading(false);

      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({statut:newStatut})

function CompanyForm({ onBack }) {
  const [step, setStep]       = useState(0);
  const [form, setForm]       = useState(INITIAL_COMPANY_FORM);
  const [drivers, setDrivers] = useState([]);
  const [saving, setSaving]   = useState(false);
  const [errors, setErrors]   = useState([]);
  const [driverForm, setDriverForm]       = useState(INITIAL_FORM);
  const [driverStep, setDriverStep]       = useState(0);
  const [driverPreview, setDriverPreview] = useState(null);
  const [showDriverForm, setShowDriverForm] = useState(false);

  const inp = {width:"100%",padding:"10px 12px",border:"1.5px solid #d1d5db",
    borderRadius:8,fontSize:14,outline:"none",boxSizing:"border-box",fontFamily:"inherit",background:"#fff"};
  const BLUE = "#2563eb";

  function validateCompany() {
    const e = [];
    if (!form.nomSociete.trim())       e.push("اسم الشركة مطلوب");
    if (!form.registreCommerce.trim()) e.push("رقم السجل التجاري مطلوب");
    if (!form.telephone.trim())        e.push("رقم الهاتف مطلوب");
    if (!form.wilaya)                  e.push("الولاية مطلوبة");
    if (!form.nomResponsable.trim())   e.push("اسم المسؤول مطلوب");
    return e;
  }

  function addDriver() {
    if (!driverForm.nomAr.trim() && !driverForm.nom.trim()) return;
    setDrivers(d => [...d, { ...driverForm, preview: driverPreview }]);
    setDriverForm(INITIAL_FORM); setDriverPreview(null);
    setDriverStep(0); setShowDriverForm(false);
  }

  function removeDriver(idx) { setDrivers(d => d.filter((_,i) => i !== idx)); }

  async function handleSubmit() {
    const e = validateCompany();
    if (e.length) { setErrors(e); return; }
    setSaving(true);
    try {
      const res = await fetch(`${API_BASE}/register-company`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ ...form, drivers })
      });
      const d = await res.json();
      if (d.success) setStep(2);
      else setErrors([d.error || "خطأ في الحفظ"]);
    } catch(e) { setErrors(["خطأ في الاتصال"]); }
    setSaving(false);
  }

  if (step === 2) return (
    <div style={{textAlign:"center",padding:"30px 0"}}>
      <div style={{fontSize:60,marginBottom:16}}>✅</div>
      <h3 style={{color:BLUE,fontWeight:800,fontSize:20,marginBottom:8}}>تم تسجيل الشركة بنجاح!</h3>
      <p style={{color:"#6b7280",fontSize:14,marginBottom:6}}>
        <b>{form.nomSociete}</b> — {drivers.length} سائق مسجّل
      </p>
      <button onClick={onBack} style={{padding:"12px 32px",borderRadius:10,border:"none",background:BLUE,color:"#fff",cursor:"pointer",fontWeight:700}}>
        العودة للرئيسية
      </button>
    </div>
  );

  return (
    <div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:20}}>
        <button onClick={onBack} style={{padding:"6px 12px",borderRadius:8,border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",fontSize:13}}>← رجوع</button>
        <h3 style={{color:BLUE,fontWeight:800,fontSize:18,margin:0}}>🏢 تسجيل شركة سيارات الأجرة</h3>
      </div>

      {/* معلومات الشركة */}
      <div style={{background:"#eff6ff",borderRadius:12,padding:16,marginBottom:20}}>
        <h4 style={{color:BLUE,fontWeight:700,fontSize:14,margin:"0 0 12px"}}>📋 معلومات الشركة</h4>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
          {[
            ["اسم الشركة *","nomSociete","text"],
            ["رقم السجل التجاري *","registreCommerce","text"],
            ["رقم الاعتماد","numeroAgreement","text"],
            ["اسم المسؤول *","nomResponsable","text"],
            ["لقب المسؤول","prenomResponsable","text"],
            ["الهاتف *","telephone","tel"],
            ["هاتف 2","telephone2","tel"],
            ["البريد الإلكتروني","email","email"],
          ].map(([label,key,type])=>(
            <div key={key} style={{display:"flex",flexDirection:"column",gap:4}}>
              <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>{label}</label>
              <input type={type} value={form[key]} onChange={e=>setForm(f=>({...f,[key]:e.target.value}))} style={inp}/>
            </div>
          ))}
          <div style={{display:"flex",flexDirection:"column",gap:4}}>
            <label style={{fontSize:11,fontWeight:600,color:"#374151"}}>الولاية *</label>
            <select value={form.wilaya} onChange={e=>setForm(f=>({...f,wilaya:e.target.value}))} style={inp}>
              <option value="">اختر الولاية</option>
              {WILAYAS.map(w=><option key={w} value={w}>{w}</option>)}

                  </div>
                  <div style={{fontSize:12,color:"#6b7280"}}>
                    {d.numPermis&&`رخصة: ${d.numPermis}`}
                    {d.numImmatriculation&&` • 🚗 ${d.numImmatriculation}`}
                  </div>
                </div>
                <button onClick={()=>removeDriver(i)}
                  style={{padding:"4px 10px",borderRadius:6,border:"1px solid #fca5a5",background:"#fef2f2",color:"#dc2626",cursor:"pointer",fontSize:12}}>
                  حذف
                </button>
              </div>
            ))}
          </div>
        )}

        {/* نموذج إضافة سائق */}
        {showDriverForm&&(
          <div style={{marginTop:16,background:"#fff",borderRadius:12,padding:16,border:"2px solid #86efac"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <h5 style={{margin:0,color:"#1a6b3c",fontWeight:700,fontSize:14}}>
                {driverStep===0?"🪪 رفع رخصة السياقة":driverStep===1?"🚗 رفع البطاقة الرمادية":"✏️ مراجعة البيانات"}
              </h5>
              <button onClick={()=>setShowDriverForm(false)}
                style={{padding:"3px 10px",borderRadius:6,border:"1px solid #d1d5db",background:"#fff",cursor:"pointer",fontSize:12,color:"#6b7280"}}>
                ✕
              </button>
            </div>

            {driverStep===0&&<>
              <UploadStep onDone={(data,prev)=>{
                if(data) setDriverForm(f=>({...f,...Object.fromEntries(Object.entries(data).filter(([,v])=>v!==""))}));
                setDriverPreview(prev); setDriverStep(1);
              }}/>
              <button onClick={()=>setDriverStep(1)} style={{width:"100%",marginTop:8,padding:9,borderRadius:8,
                border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",color:"#6b7280",fontSize:12}}>
                تخطي ←
              </button>
            </>}

            {driverStep===1&&<>
              <UploadCarteGrise color="#1a6b3c" onDone={(data)=>{
                if(data) setDriverForm(f=>({...f,...Object.fromEntries(Object.entries(data).filter(([,v])=>v!==""))}));
                setDriverStep(2);
              }}/>
              <button onClick={()=>setDriverStep(2)} style={{width:"100%",marginTop:8,padding:9,borderRadius:8,
                border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",color:"#6b7280",fontSize:12}}>
                تخطي ←
              </button>
            </>}

            {driverStep===2&&<>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
                {[
                  ["اللقب (عربي)","nomAr"],["الاسم (عربي)","prenomAr"],
                  ["Nom","nom"],["Prénom","prenom"],
                  ["رقم التعريف الوطني","nin"],["رقم الرخصة","numPermis"],
                  ["تاريخ انتهاء الرخصة","dateExpiration"],["الهاتف","telephone"],
                  ["رقم التسجيل","numImmatriculation"],["الماركة","marque"],
                  ["نوع المركبة","typeVehicule"],["سنة أول استعمال","anneeCirculation"],
                ].map(([label,key])=>(
                  <div key={key} style={{display:"flex",flexDirection:"column",gap:3}}>
                    <label style={{fontSize:10,fontWeight:600,color:"#6b7280"}}>{label}</label>
                    <input value={driverForm[key]||""} onChange={e=>setDriverForm(f=>({...f,[key]:e.target.value}))}
                      style={{...inp,fontSize:12,padding:"7px 10px"}}/>
                  </div>
                ))}
              </div>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>setDriverStep(1)}
                  style={{flex:1,padding:10,borderRadius:8,border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",fontSize:13}}>
                  ← رجوع
                </button>
                <button onClick={addDriver}
                  style={{flex:2,padding:10,borderRadius:8,border:"none",background:"#1a6b3c",color:"#fff",cursor:"pointer",fontWeight:700,fontSize:13}}>
                  ✅ إضافة السائق
                </button>
              </div>
            </>}
          </div>
        )}
      </div>

      {errors.length>0&&(
        <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"10px 14px",marginBottom:12}}>
          {errors.map(e=><div key={e} style={{color:"#dc2626",fontSize:13,marginBottom:3}}>⚠️ {e}</div>)}
        </div>
      )}
      <button onClick={handleSubmit} disabled={saving}
        style={{width:"100%",padding:14,borderRadius:10,border:"none",
          background:saving?"#93c5fd":BLUE,color:"#fff",cursor:saving?"default":"pointer",fontWeight:700,fontSize:15}}>
        {saving?"جارٍ الحفظ...":"✅ تأكيد تسجيل الشركة"}
      </button>
    </div>
  );
}


// ==================== MAIN APP ====================
function App() {
  const [page, setPage]           = useState("landing"); // landing | driver | company
  const [step, setStep]           = useState(0);
  const [form, setForm]           = useState(INITIAL_FORM);
  const [preview, setPreview]     = useState(null);
  const [errors, setErrors]       = useState([]);
  const [saving, setSaving]       = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);

  function reset() { setStep(0); setForm(INITIAL_FORM); setPreview(null); setErrors([]); }

  function handleExtracted(data, prev) {
    if (data) setForm(f => ({ ...f, ...Object.fromEntries(Object.entries(data).filter(([,v])=>v!==undefined&&v!=="")) }));
    setPreview(prev);
    setStep(1);
  }

  function validate() {
    const e = [];
    if (!form.nomAr.trim())        e.push("اللقب (عربي) مطلوب");
    if (!form.prenomAr.trim())     e.push("الاسم (عربي) مطلوب");
    if (!form.nin.trim())          e.push("رقم التعريف الوطني مطلوب");
    if (!form.numPermis.trim())    e.push("رقم رخصة السياقة مطلوب");
    if (!form.dateExpiration)      e.push("تاريخ انتهاء الرخصة مطلوب");
    if (form.categories.length===0) e.push("يجب اختيار فئة واحدة على الأقل");
    return e;
  }

  async function handleSubmit() {
    const e = validate();
    if (e.length) { setErrors(e); return; }
    setSaving(true);
    try {
      const res = await fetch(`${API_BASE}/register`, {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify(form)
      });
      const d = await res.json();
      if (d.success) setStep(2);
      else setErrors([d.error || "خطأ في الحفظ"]);
    } catch(err) {
      setErrors(["خطأ في الاتصال بالخادم"]);
    }
    setSaving(false);
  }

  const headerColor = page === "company" ? "#2563eb" : "#1a6b3c";
  const headerTitle = page === "company" ? "تسجيل شركة سيارات الأجرة" : "تسجيل سائقي سيارات الأجرة";
  const headerSub   = page === "company" ? "مركز التكوين — نقل الأشخاص" : "مركز التكوين — نقل الأشخاص";

  return (
    <div style={{minHeight:"100vh",background:"#f0fdf4",fontFamily:"Segoe UI,Tahoma,Arial,sans-serif"}} dir="rtl">
      <style>{`@keyframes spin{to{transform:rotate(360deg)}} *{box-sizing:border-box}`}</style>

      {/* Header */}
      <div style={{background:headerColor,boxShadow:"0 2px 8px rgba(0,0,0,.15)"}}>
        <div style={{maxWidth:660,margin:"0 auto",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:58}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <span style={{fontSize:22}}>{page==="company"?"🏢":"🚕"}</span>
            <div>
              <div style={{color:"#fff",fontWeight:700,fontSize:14}}>{headerTitle}</div>
              <div style={{color:"rgba(255,255,255,.75)",fontSize:11}}>{headerSub}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            {page!=="landing"&&(
              <button onClick={()=>{setPage("landing");reset();}} style={{padding:"6px 12px",borderRadius:8,border:"1px solid rgba(255,255,255,.3)",background:"rgba(255,255,255,.1)",color:"#fff",cursor:"pointer",fontSize:12}}>
                🏠 الرئيسية
              </button>
            )}
            <button onClick={()=>setShowAdmin(true)} style={{padding:"6px 13px",borderRadius:8,border:"1px solid rgba(255,255,255,.3)",background:"rgba(255,255,255,.1)",color:"#fff",cursor:"pointer",fontSize:12}}>
              🗂️ الإدارة
            </button>
          </div>
        </div>
      </div>

      {/* Content */}
      <div style={{maxWidth:660,margin:"0 auto",padding:"28px 14px"}}>
        <div style={{background:"#fff",borderRadius:20,boxShadow:"0 4px 24px rgba(0,0,0,.07)",padding:"28px 24px"}}>

          {/* Landing */}
          {page==="landing"&&<LandingPage onSelect={p=>{setPage(p);reset();}}/>}

          {/* Company */}
          {page==="company"&&<CompanyForm onBack={()=>{setPage("landing");reset();}}/>}

          {/* Driver */}
          {page==="driver"&&<>
            {step<3&&<StepBar step={step}/>}

            {/* خطوة 0: رفع رخصة السياقة + البطاقة الرمادية معاً */}
            {step===0&&<UploadDocuments onDone={(permisData, griseData, preview)=>{
              const merged = {};
              if (permisData) Object.entries(permisData).forEach(([k,v])=>{ if(v!=="") merged[k]=v; });
              if (griseData)  Object.entries(griseData).forEach(([k,v])=>{ if(v!=="") merged[k]=v; });
              setForm(f=>({...f,...merged}));
              setPreview(preview);
              setStep(1);
            }}/>}

            {/* خطوة 1: مراجعة البيانات */}
            {step===1&&<>
              <ReviewStep form={form} setForm={setForm} preview={preview}/>
              <ReviewVehicle form={form} setForm={setForm}/>
              {errors.length>0&&(
                <div style={{background:"#fef2f2",border:"1px solid #fecaca",borderRadius:10,padding:"10px 14px",marginTop:14}}>
                  {errors.map(e=><div key={e} style={{color:"#dc2626",fontSize:13,marginBottom:3}}>⚠️ {e}</div>)}
                </div>
              )}
              <div style={{display:"flex",gap:10,marginTop:22}}>
                <button onClick={()=>setStep(1)} style={{flex:1,padding:13,borderRadius:10,border:"1.5px solid #d1d5db",background:"#fff",cursor:"pointer",fontWeight:600,color:"#374151"}}>← رجوع</button>
                <button onClick={handleSubmit} disabled={saving} style={{flex:2,padding:13,borderRadius:10,border:"none",background:saving?"#86efac":"#1a6b3c",color:"#fff",cursor:saving?"default":"pointer",fontWeight:700,fontSize:15}}>
                  {saving?"جارٍ الإرسال...":"✅ تأكيد التسجيل"}
                </button>
              </div>
            </>}

            {/* خطوة 3: تأكيد */}
            {step===2&&<>
              <ConfirmStep form={form} preview={preview}/>
              <button onClick={reset} style={{width:"100%",marginTop:18,padding:13,borderRadius:10,border:"none",background:"#1a6b3c",color:"#fff",cursor:"pointer",fontWeight:700,fontSize:15}}>
                + تسجيل مترشح آخر
              </button>
            </>}
          </>}

        </div>
        <p style={{textAlign:"center",color:"#9ca3af",fontSize:12,marginTop:18}}>
          بياناتك محفوظة بشكل آمن على خادم المركز
        </p>
      </div>

      {showAdmin&&<AdminPanel onClose={()=>setShowAdmin(false)}/>}
    </div>
  );
}


ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
