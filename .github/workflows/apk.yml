# بناء تطبيق الهاتف «سيارات الأجرة» (APK) — الملف يظهر في صفحة التشغيل (Artifacts) باسم Taxi-mobile-apk
name: APK تطبيق الهاتف

on:
  push:
    paths:
      - "mobile_apk/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle -p mobile_apk assembleDebug --no-daemon
      - name: Rename
        run: cp mobile_apk/app/build/outputs/apk/debug/app-debug.apk Taxi-mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Taxi-mobile-apk
          path: Taxi-mobile.apk
          retention-days: 90
