# Build mobile APKs: Taxi-mobile-apk (production) + Taxi-mobile-TEST-apk (test environment)
name: APK

on:
  push:
    paths:
      - "mobile_apk/**"
      - ".github/workflows/apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APKs (prod + staging)
        run: gradle -p mobile_apk assembleProdDebug assembleStagingDebug --no-daemon
      - name: Rename
        run: |
          cp mobile_apk/app/build/outputs/apk/prod/debug/app-prod-debug.apk Taxi-mobile.apk
          cp mobile_apk/app/build/outputs/apk/staging/debug/app-staging-debug.apk Taxi-mobile-TEST.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Taxi-mobile-apk
          path: Taxi-mobile.apk
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Taxi-mobile-TEST-apk
          path: Taxi-mobile-TEST.apk
          retention-days: 90
